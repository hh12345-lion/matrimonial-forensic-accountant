<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form detection</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="organisation" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="instruction_type">
        <option value="Expert Witness Report (FPR Part 25)">Expert Witness Report (FPR Part 25)</option>
        <option value="Business Valuation">Business Valuation</option>
        <option value="Form E / Financial Disclosure Review">Form E / Financial Disclosure Review</option>
        <option value="Hidden Assets Investigation">Hidden Assets Investigation</option>
        <option value="Income / Lifestyle Analysis">Income / Lifestyle Analysis</option>
        <option value="Add-backs / Financial Reconstruction">Add-backs / Financial Reconstruction</option>
        <option value="Single Joint Expert (SJE) Appointment">Single Joint Expert (SJE) Appointment</option>
        <option value="Preliminary Assessment">Preliminary Assessment</option>
        <option value="Advisory / Litigation Support">Advisory / Litigation Support</option>
        <option value="Other">Other</option>
      </select>
      <select name="practice_area">
        <option value="Financial Remedy / Divorce">Financial Remedy / Divorce</option>
        <option value="Schedule 1 (Children Act)">Schedule 1 (Children Act)</option>
        <option value="TOLATA / Cohabitation">TOLATA / Cohabitation</option>
        <option value="High Net Worth Matrimonial">High Net Worth Matrimonial</option>
        <option value="Self-Employed Income">Self-Employed Income</option>
        <option value="Overseas Assets / Trusts">Overseas Assets / Trusts</option>
        <option value="Other">Other</option>
      </select>
      <input type="date" name="deadline" />
      <textarea name="message"></textarea>
      <select name="referral">
        <option value="Search engine">Search engine</option>
        <option value="Referral from solicitor">Referral from solicitor</option>
        <option value="Referral from colleague">Referral from colleague</option>
        <option value="LinkedIn">LinkedIn</option>
        <option value="Professional body">Professional body</option>
        <option value="Other">Other</option>
      </select>
    </form>
  </body>
</html>
